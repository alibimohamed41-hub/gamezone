<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GameZone</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>🎮 GameZone</h1>
    <p>Your gaming adventure starts here!</p>
  </header>

  <main>
    <h2>🔥 Choose Your Game</h2>

    <div class="games">
      <div class="card">
        <h3>🔢 Guess the Number</h3>
        <p>Find the secret number!</p>
        <button onclick="guessGame()">Play Now</button>
      </div>

      <div class="card">
        <h3>✂️ Rock Paper Scissors</h3>
        <p>Challenge the computer!</p>
        <button onclick="rpsGame()">Play Now</button>
      </div>
    </div>

    <p id="result">Choose a game to begin.</p>
  </main>

  <script src="script.js"></script>
</body>
</html>
